version: '3.8'

services:
  idm-vton:
    build: .
    container_name: idm-vton-app
    ports:
      - "8000:8000"
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTHONPATH=/app
      - MODEL_PATH=/app/models
      - CKPT_PATH=/app/ckpt
      - DATA_PATH=/app/data
      - LOG_LEVEL=INFO
    volumes:
      # Mount models directory for persistence
      - ./ckpt:/app/ckpt:ro
      - ./models:/app/models:ro
      # Mount data directory for input/output
      - ./data:/app/data:rw
      # Mount logs directory
      - ./logs:/app/logs:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Redis for caching and background tasks
  redis:
    image: redis:7-alpine
    container_name: idm-vton-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  redis_data:
